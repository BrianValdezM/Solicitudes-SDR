<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de solicitudes · Verificación en dos pasos</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/barra-superior :: barra}"></div>

<div class="contenedor-pagina">
    <div class="tarjeta">
        <h1 class="tarjeta__titulo">Portal de solicitudes</h1>
        <h2 class="tarjeta__subtitulo">Verificación en dos pasos</h2>

        <div th:if="${mensajeError}" class="alerta alerta--error" th:text="${mensajeError}"></div>

        <div th:if="${configurando}">
            <p class="tarjeta__texto">
                Es tu primer inicio de sesión con 2FA. Escanea este código QR con
                Google Authenticator, Microsoft Authenticator o Authy y luego
                escribe el código de 6 dígitos que te genere.
            </p>
            <div class="qr-2fa">
                <!-- Generador de QR gratuito basado en la URL otpauth. Si prefieres
                     generarlo tú mismo en el servidor (sin depender de un servicio
                     externo), dime y te dejo el código con ZXing. -->
                <img th:src="@{'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + ${urlOtpAuth}}"
                     alt="Código QR 2FA" width="180" height="180">
            </div>
        </div>

        <p class="tarjeta__texto" th:unless="${configurando}">
            Abre tu app autenticadora e ingresa el código de 6 dígitos actual.
        </p>

        <form th:action="@{/verificar-2fa}" method="post">
            <div class="campo campo--codigo">
                <label for="codigo">Código de verificación</label>
                <input type="text" id="codigo" name="codigo" inputmode="numeric" pattern="\d{6}"
                       maxlength="6" placeholder="000000" required autofocus>
            </div>
            <button type="submit" class="boton-principal">Verificar</button>
        </form>
    </div>
</div>

</body>
</html>
