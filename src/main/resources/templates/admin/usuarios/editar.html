<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/plantilla :: pagina('Editar usuario', 'usuarios', ~{::contenido})}">
<body>
<div th:fragment="contenido">

    <div class="tarjeta" style="max-width:520px;">
        <h1 class="tarjeta__titulo">Editar usuario</h1>

        <div th:if="${mensajeError}" class="alerta alerta--error" th:text="${mensajeError}"></div>

        <form th:action="@{'/admin/usuarios/' + ${usuario.id} + '/editar'}" method="post">
    <div class="campo"><label>Nombre</label>
        <input name="nombre" th:value="${usuario.nombre}" required></div>
    <div class="campo"><label>Apellidos</label>
        <input name="apellidos" th:value="${usuario.apellidos}" required></div>
    <div class="campo"><label>Correo</label>
        <input type="email" name="correo" th:value="${usuario.correo}" required></div>
    <div class="campo"><label>Teléfono (opcional)</label>
        <input name="telefono" th:value="${usuario.telefono}"></div>
    <div class="campo"><label>ID Cliente (opcional)</label>
        <input name="idCliente" th:value="${usuario.idCliente}"></div>
    <div class="campo"><label>Rol</label>
        <select name="rol">
            <option value="USUARIO" th:selected="${usuario.rol == 'USUARIO'}">USUARIO</option>
            <option value="ADMIN"   th:selected="${usuario.rol == 'ADMIN'}">ADMIN</option>
        </select></div>

    <!-- NUEVO: resetear contraseña -->
    <div class="campo campo--checkbox">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input type="checkbox" name="resetearContrasena" value="true"
                   style="width:auto; margin:0;">
            <span>Restablecer contraseña y enviarla por correo</span>
        </label>
        <p class="tarjeta__texto" style="margin:6px 0 0; font-size:0.8rem;">
            Se generará una contraseña temporal y se enviará al correo del usuario.
            Al iniciar sesión, se le pedirá cambiarla.
        </p>
    </div>

    <button class="boton-principal" type="submit">Guardar cambios</button>
</form>

        <a th:href="@{/admin/usuarios}" class="enlace-secundario">← Volver al listado</a>
    </div>

</div>
</body>
</html>
